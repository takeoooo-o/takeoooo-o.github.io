<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>たけおの部屋</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Press+Start+2P&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="crt"></div>

  <header class="site-header">
    <h1 class="title" data-text="たけおの部屋">たけおの部屋</h1>

    <nav class="menu">
      <a href="#">ほーむ</a>
      <a href="あばうと/">あばうと</a>
      <a href="https://zonsurvival.ddns.net/">宣伝</a>
      <a href="https://osu.ppy.sh/users/37321995/osu" target="_blank">osu!</a>
      <a href="old/" target="_blank">old</a>
    </nav>
  </header>

  <main>
    <section class="panel intro">
      <h2 class="panel-title">Welcome!</h2>
      <p>ノリで作ったサイトです</p>
      <p class="blink">&gt; PRESS START</p>
    </section>

    <section class="panel sns-profile">
      <h2 class="panel-title">SNSリンク</h2>

      <div class="social-links">
        <a href="https://www.youtube.com/@takeoooo-o"
           target="_blank"
           class="btn btn-youtube">
          YouTube
        </a>

        <a href="https://x.com/takeo_2525_"
           target="_blank"
           class="btn btn-twitter">
          X
        </a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>&copy; たけおの部屋</p>
  </footer>

  <!-- 右下の爆発ボタン -->
  <button id="explosion-button">
    💥 爆発！
  </button>

  <!-- 爆発動画 -->
  <video id="explosion-video" playsinline>
    <source src="explosion.mp4" type="video/mp4">
  </video>

  <script>
    const button = document.getElementById("explosion-button");
    const video = document.getElementById("explosion-video");

    button.addEventListener("click", () => {
      button.style.display = "none";
      video.style.display = "block";
      video.currentTime = 0;
      video.play();
    });

    video.addEventListener("ended", () => {
      video.style.display = "none";
      button.style.display = "block";
    });
  </script>
</body>
</html>
